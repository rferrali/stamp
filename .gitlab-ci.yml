include:
  - project: "GNOME/citemplates"
    file: "templates/default-rules.yml"
  - project: 'GNOME/citemplates'
    file: 'flatpak/flatpak_ci_initiative.yml'
  - component: gitlab.gnome.org/GNOME/citemplates/release-service@master
    inputs:
      dist-job-name: "build-flatpak"

variables:
  APP_ID: 'org.tabos.stamp'
  BUNDLE: 'org.tabos.stamp.flatpak'
  FLATPAK_MODULE: 'stamp'
  MANIFEST_PATH: 'org.tabos.stamp.json'
  RUNTIME_REPO: 'https://nightly.gnome.org/gnome-nightly.flatpakrepo'

stages:
  - check
  - build
  - deploy

check-code-style:
  image: fedora:latest
  stage: 'check'
  before_script:
    - dnf install -y colordiff diffutils python3 uncrustify blueprint-compiler
  script:
    - bash data/check-code-style

codespell:
  image: fedora:latest
  stage: 'check'
  before_script:
    - dnf install -y codespell
  script:
    - codespell src -L crate -S "*.png,*.po,.git,*.jpg,eff_large_wordlist.txt,.mypy_cache,_build" -f

build-flatpak:
  extends: '.flatpak@x86_64'
  stage: build
  before_script:
    - python3 .gitlab-ci/prepare-flatpak-checks.py org.tabos.stamp.json ci-flatpak.json
    - python3 .gitlab-ci/install-flatpak-extensions.py ci-flatpak.json "$ARCH"
  variables:
    MANIFEST_PATH: 'ci-flatpak.json'
    GLYCIN_DISABLE_SANDBOX: 'i-know-the-risks'
    FLATPAK_VALIDATE_ICON: '$CI_PROJECT_DIR/.gitlab-ci/flatpak-validate-icon'
  after_script:
    - |
      set -euo pipefail
      mkdir -p ci-reports
      for reports in .flatpak-builder/build/"${FLATPAK_MODULE}"-*/_flatpak_build/ci-reports; do
        if [ -d "$reports" ]; then
          cp -a "$reports/." ci-reports/
        fi
      done
      cp .gitlab-ci/landing-page.html ci-reports/index.html
  coverage: '/^lines: ([0-9.]+)%/'
  artifacts:
    when: always
    paths:
      - "*.flatpak"
      - "*.flatpak.sha256sum"
      - repo.tar
      - "${CI_PROJECT_NAME}-docs.tar.gz"
      - '.flatpak-builder/build/**/_flatpak_build/meson-logs/'
      - '.flatpak-builder/build/**/_flatpak_build/meson-dist/'
      - public-dist
      - ci-reports/
    reports:
      junit:
        - ".flatpak-builder/build/${FLATPAK_MODULE}*/_flatpak_build/meson-logs/testlog*.junit.xml"
        - ci-reports/testlog-coverage.junit.xml
      coverage_report:
        coverage_format: cobertura
        path: ci-reports/cobertura.xml

build-flatpak-aarch64:
  extends: '.flatpak@aarch64'
  stage: build
  before_script: []
  variables:
    GLYCIN_DISABLE_SANDBOX: 'i-know-the-risks'
    FLATPAK_VALIDATE_ICON: '$CI_PROJECT_DIR/.gitlab-ci/flatpak-validate-icon'

gobject-linter:
  stage: check
  image:
    name: ghcr.io/bilelmoussaoui/gobject-linter:main-5afb48e
    entrypoint: [""]
  allow_failure: false
  script:
    - |
      set -euo pipefail
      status=0
      gobject-linter src --format gitlab-codequality > gobject-linter-codequality.json || status=1
      gobject-linter src --format text > gobject-linter.log || status=1
      cat gobject-linter.log

      # Reject warnings as well as errors using the structured report.
      python3 - <<'PY' || status=1
      import json
      from pathlib import Path

      findings = json.loads(Path("gobject-linter-codequality.json").read_text())
      if not isinstance(findings, list):
          raise SystemExit("Invalid gobject-linter Code Quality report")
      if findings:
          raise SystemExit(f"gobject-linter: {len(findings)} warning(s)/error(s)")
      PY

      exit "$status"
  artifacts:
    when: always
    paths:
      - gobject-linter-codequality.json
      - gobject-linter.log
    reports:
      codequality: gobject-linter-codequality.json

nightly:
  extends: '.publish_nightly'
  needs: ['build-flatpak']

nightly-aarch64:
  extends: '.publish_nightly'
  needs: ['build-flatpak-aarch64']

pages:
  stage: deploy
  needs: [ "build-flatpak" ]
  script:
    - mkdir -p public
    - cp -a ci-reports/. public/
  artifacts:
    paths:
      - public
    expire_in: 1 day
  rules:
    - if: ($CI_DEFAULT_BRANCH == $CI_COMMIT_BRANCH)
